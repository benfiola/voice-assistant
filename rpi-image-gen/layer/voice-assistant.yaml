# METABEGIN
# X-Env-Layer-Name: voice-assistant
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: project
# X-Env-Layer-Desc: Voice Assistant customizations - clone repo and install dependencies
# X-Env-Layer-Requires: debian-trixie-arm64, rpi-debian-trixie, rpi-misc-skel, systemd-min, systemd-net-min, systemd-timesyncd, iwd, wireless-regulatory
# METAEND
---
mmdebstrap:
  packages:
    - git
  customize-hooks:
    # configure wifi
    - |
      set -eu
      profile="$1/var/lib/iwd/${IGconf_wifi_ssid}.psk"
      cat <<-EOF > "$profile"
      [Security]
      Passphrase=${IGconf_wifi_password}
      EOF
      chmod 0600 "$profile"
    # set up voice-assistant
    - |
      chroot $1 sh -c '
        set -eu
        git clone --recurse-submodules https://github.com/benfiola/voice-assistant.git /home/assistant/voice-assistant
        /home/assistant/voice-assistant/bootstrap.sh
      '
